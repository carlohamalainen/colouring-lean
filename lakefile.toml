name = "colouring"
version = "0.1.0"
description = "A shared colouring page: a never-ending demo of the Datastar Lean SDK."
license = "MIT"
defaultTargets = ["colouring"]

[[require]]
name = "datastar"
git = "https://github.com/starfederation/datastar-lean"
rev = "4175d592c33930d37e310e6e2d08e9c626ef5ba9"

[[require]]
name = "datastar-brotli"
git = "https://github.com/starfederation/datastar-lean"
subDir = "datastar-brotli"
rev = "4175d592c33930d37e310e6e2d08e9c626ef5ba9"

[[require]]
name = "datastar-leanin"
git = "https://github.com/starfederation/datastar-lean"
subDir = "datastar-leanin"
rev = "4175d592c33930d37e310e6e2d08e9c626ef5ba9"

# LeanIn links its socket shim, which needs libuv.
[[lean_exe]]
name = "colouring"
root = "Main"
moreLinkArgs = ["-luv"]
